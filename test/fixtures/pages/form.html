<!doctype html>
<html><head><meta charset="utf-8"><title>Apply — Acme Internships</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 20px 40px; color: #222; }
  nav a { margin-right: 14px; }
  form { max-width: 560px; }
  label { display: block; margin-top: 12px; }
  input, select, textarea { font: inherit; padding: 6px 8px; width: 100%; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .fake-check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .box { width: 16px; height: 16px; border: 1px solid #888; border-radius: 3px; display: inline-block; }
  .sr-only:checked + .box { background: #4f46e5; }
  #cover { min-height: 60px; border: 1px solid #aaa; padding: 6px; }
  .wrap { position: relative; display: inline-block; margin-top: 16px; }
  .shade { position: absolute; inset: 0; background: rgba(0,0,0,.05); }
  .far { margin-top: 1400px; }
  fieldset { margin-top: 14px; }
  fieldset label { display: inline; margin-right: 12px; }
  fieldset input { width: auto; }
</style></head>
<body>
<nav><a href="/">Home</a><a href="/jobs">Jobs</a><a href="https://other.example.com/help">Help center</a></nav>
<input id="search" type="search" placeholder="Search jobs" style="width:260px">
<h1>Software Engineering Intern</h1>
<h2>Your application</h2>
<form id="apply" aria-label="Application">
  <label for="first">First name</label><input id="first" name="first" autocomplete="given-name" required>
  <input aria-label="Last name" name="last" autocomplete="family-name">
  <label>Email <input type="email" name="email" autocomplete="email" required></label>
  <input name="phone" placeholder="Phone number" type="tel">
  <label>Password <input type="password" name="pw"></label>
  <label>School year
    <select name="year"><option value="">Choose…</option><option>Freshman</option><option>Sophomore</option><option value="jr">Junior</option><option>Senior</option></select>
  </label>
  <div id="react-root"></div>
  <label>Card number <input name="cardnumber" inputmode="numeric"></label>
  <fieldset><legend>Are you authorized to work in the US?</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>
  <label class="fake-check"><input type="checkbox" class="sr-only" id="agree"><span class="box"></span> I agree to the terms</label>
  <div id="cover" contenteditable="true" role="textbox" aria-label="Cover letter"></div>
  <zai-widget></zai-widget>
  <iframe id="frame" srcdoc="<label>Portfolio URL <input id='port'></label>" style="height:60px;width:100%;border:1px solid #ccc"></iframe>
  <div class="wrap"><button type="button" id="covered">Covered thing</button><div class="shade"></div></div>
  <button type="button" id="cancel">Cancel</button>
  <button id="submit">Submit application</button>
</form>
<a class="far" style="display:block" href="/careers/benefits">Benefits</a>
<script src="../../../node_modules/react/umd/react.development.js"></script>
<script src="../../../node_modules/react-dom/umd/react-dom.development.js"></script>
<script>
  window.log = { submitted: 0, coveredClicks: 0, shadowClicks: 0, searchEnter: 0, cancel: 0, reactMajor: "" };
  document.getElementById("apply").addEventListener("submit", (e) => { e.preventDefault(); log.submitted++; });
  document.getElementById("covered").addEventListener("click", () => log.coveredClicks++);
  document.getElementById("cancel").addEventListener("click", () => log.cancel++);
  document.getElementById("search").addEventListener("keydown", (e) => { if (e.key === "Enter") log.searchEnter++; });
  customElements.define("zai-widget", class extends HTMLElement {
    constructor() { super(); const r = this.attachShadow({ mode: "open" }); const b = document.createElement("button"); b.type = "button"; b.textContent = "Shadow action"; b.onclick = () => log.shadowClicks++; r.append(b); }
  });
  function Major() {
    const [v, setV] = React.useState("");
    log.reactMajor = v;
    return React.createElement("label", null, "Major ", React.createElement("input", { name: "major", value: v, onChange: (e) => setV(e.target.value) }), React.createElement("small", { id: "major-echo" }, v ? "You typed: " + v : ""));
  }
  ReactDOM.createRoot(document.getElementById("react-root")).render(React.createElement(Major));
</script>
</body></html>
